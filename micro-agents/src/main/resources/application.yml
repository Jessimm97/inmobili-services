server:
  port: 8082

spring:
  application:
    name: micro-agents
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/immobili_db?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    service-url:
      defaultZone: http://micro-eureka:8761/eureka/