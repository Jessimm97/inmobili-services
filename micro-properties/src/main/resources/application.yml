server:
  port: 8081 # Puerto interno (el Gateway lo buscará aquí)

spring:
  application:
    name: micro-properties
  
  # CONFIGURACIÓN MYSQL / AWS RDS
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/immobili_db?serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update # Crea las tablas automáticamente (útil en dev)
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  # CONFIGURACIÓN ELASTICSEARCH
  elasticsearch:
    uris: http://elasticsearch:9200
    socket-timeout: 10s

eureka:
  client:
    service-url:
      defaultZone: http://micro-eureka:8761/eureka/